# devin workspace configuration
version: 1
tools:
  - name: echo_nonce
    description: Echo a nonce and return a fresh attestation token.
    endpoint: https://couple-hydraulic-requires-neither.trycloudflare.com/mcp
    input_schema:
      type: object
      properties:
        nonce: {type: string}
mcp_servers:
  envcheck-attest:
    url: https://couple-hydraulic-requires-neither.trycloudflare.com/mcp
    transport: http
commands:
  attest: "echo_nonce"
